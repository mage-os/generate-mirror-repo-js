name: Build, deploy & check Release

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'The composer repository url'
        required: true
        default: 'https://preview-repo.mage-os.org/'
        type: choice
        options:
          - https://preview-repo.mage-os.org/
          - https://repo.mage-os.org/
      remote_dir:
        description: 'The deploy target directory on the repo host'
        required: true
        default: '/var/www/preview-repo.mage-os.org/html/'
        type: choice
        options:
          - /var/www/preview-repo.mage-os.org/html/
          - /var/www/repo.mage-os.org/html/
      mageos_release:
        description: 'New Mage-OS version (e.g. 1.0.0)'
        required: false
        default: ''
        type: string
      upstream_release:
        description: 'Closest Magento Open Source version for new release (e.g. 2.4.6-p2)'
        required: false
        default: ''
        type: string
      release_refs_file:
        description: 'Optional refs file for a grace-window release, e.g. src/build-config/mage-os-release-refs/3.4.1.js'
        required: false
        default: ''
        type: string
      publish_tag:
        description: 'Push new release tag to repos'
        required: false
        default: false
        type: boolean

# One release build per target repo at a time; never auto-cancel a release
# mid-deploy or mid-tag-push
concurrency:
  group: ${{ github.workflow }}-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    name: "generate & deploy"
    if: contains('["vinai", "rhoerr", "marcelmtz", "mage-os-ci"]', github.actor)
    with:
      repo: ${{ inputs.repo }}
      remote_dir: ${{ inputs.remote_dir }}
      entrypoint: src/make/mageos-release.js
      delete: false
      mageos_release: ${{ inputs.mageos_release }}
      upstream_release: ${{ inputs.upstream_release }}
      publish_tag: ${{ inputs.publish_tag }}
      release_refs_file: ${{ inputs.release_refs_file }}

    secrets:
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  compute-release-service-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.supported-version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3
      - uses: mage-os/github-actions/supported-version@main
        with:
          project: 'mage-os'
          kind: 'usable'
        id: supported-version
  integration-check:
    name: "installation check"
    needs: [ deploy, compute-release-service-versions ]
    uses: mage-os/github-actions/.github/workflows/integration.yaml@main
    with:
      package_name: mage-os/demo-package
      use_local_source: false
      matrix: ${{ needs.compute-release-service-versions.outputs.matrix }}
      test_command: ../../../vendor/bin/phpunit ../../../vendor/mage-os/demo-package/Test/Integration
      fail-fast: false
      magento_repository: ${{ inputs.repo }}
      composer_cache_key: ${{ inputs.composer_cache_key || 'v1' }}
  storefront-admin-check:
    name: "storefront & admin check"
    # The first check in this pipeline that installs the version being
    # released. The installation check above cannot: its matrix comes from
    # supported-version (kind: usable), which filters
    # supported-version/src/versions/mage-os/individual.json, and a version's
    # entry is only added there after it ships. So that job re-installs the
    # previously released versions from the newly deployed repository, and
    # goes green without the new packages ever being installed.
    #
    # It runs after deploy because it installs from inputs.repo, and before
    # the tag push because the tag is the half of a release that is expensive
    # to retract -- push-release-tag pushes it to every mage-os/* origin,
    # while the repository deploy is additive and can be superseded.
    #
    # On a preview build publish_tag is false, so publish-release-tag is
    # skipped and this job reports without a tag at stake: it is what tells a
    # release manager whether the preview is worth promoting.
    if: ${{ inputs.mageos_release != '' }}
    needs: [ deploy ]
    uses: mage-os/github-actions/.github/workflows/e2e.yaml@main
    with:
      magento_repository: ${{ inputs.repo }}
      magento_version: "mage-os/project-community-edition:${{ inputs.mageos_release }}"
      artifact_name: "storefront-admin-check-${{ inputs.mageos_release }}"
      # suite_ref is left at the e2e workflow's default, which tracks the
      # github-actions default branch along with the uses: ref above. Unlike
      # the installation check, whose test code ships inside the package being
      # released, this suite is fetched at run time -- so whether both refs
      # should be pinned to a tag is worth settling before a release is gated
      # on it rather than only reported on.
  publish-release-tag:
    name: "Publish release tag"
    if: ${{ success() && inputs.mageos_release && inputs.publish_tag }}
    needs: [ deploy, integration-check, storefront-admin-check ]
    uses: ./.github/workflows/push-release-tag.yml
    with:
      mageos_release: ${{ inputs.mageos_release }}

    secrets:
      MAGE_OS_CI_TOKEN: ${{ secrets.MAGE_OS_CI_TOKEN }}
